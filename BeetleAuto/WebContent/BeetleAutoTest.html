<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html>
<head>
<title>BeetelAuto Test</title>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
	<script src="scripts/beetleAuto.js" type="text/javascript"></script>
	<link rel="stylesheet" type="text/css" href="scripts/beetleAuto.css">	
</head>

<body>
<div >
<p>
Select ID Type and then start typing appropriate example.<br>
Autocomplete will kick in at a different stage, depending on ID type.
</p>

<p>

<input type="radio" name="idtype" id="geneID" checked="checked"> GeneID (e.g. TC030446)<br>
<input type="radio" name="idtype" id="geneSymbol"> Gene Symbol (e.g. nos)<br>
<input type="radio" name="idtype" id="geneName"> Gene Name (e.g. nanos)<br>
<input type="radio" name="idtype" id="flyFBgn"> Fly FBgn (e.g. FBgn0035661)<br>
<input type="radio" name="idtype" id="flyCG"> Fly CG Number (e.g. CG9915)<br>
<input type="radio" name="idtype" id="flySymbol"> Fly Symbol (e.g. vkg)

</p>

<p>
Gene: <input type="text" autocomplete="off" size="40" id="inputField" style="height:15px;" onkeyup="findNames();">
</p>

<!-- start of autocomplete div -->
<div style="position:absolute;" id="popup">
<table id="menuTable" cellspacing="0" cellpadding="0">            
<tbody id="menuTableBody"><tr><td></td></tr></tbody>
</table>
</div><!-- end of autocomplete div -->

</div>

</body>
</html>
